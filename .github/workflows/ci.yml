name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Fork-safe by design (ADR-0012/0014): no secrets, no matrix, no private hosts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go test ./... -race -count=1

  # Tier-2 (ADR-0012): real exec -> dokku shim on PATH; failure injection covered.
  test-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: make test-shim

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v7
        with:
          args: --timeout 5m

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/hygiene.sh

  # T-113 / ADR-0015: optional law gate (proofs + differential bridge).
  # Fork-safe; graceful-skip semantics live in the Makefile target.
  laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: curl -fsSL https://bend-lang.com/install.sh | sh
      - run: make laws
