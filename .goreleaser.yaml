# SPDX-License-Identifier: MIT
# .goreleaser.yaml — TOP release engineering (T-507).
#
# Invoked WITHOUT adding a dependency to go.mod:
#
#   go run github.com/goreleaser/goreleaser/v2@v2.19.0 check     # validate
#   go run github.com/goreleaser/goreleaser/v2@v2.19.0 --snapshot --clean
#   go run github.com/goreleaser/goreleaser/v2@v2.19.0 release    # CI runs it on tags (.github/workflows/release.yml)
#
# Pin: v2.19.0 — the latest stable v2 tag as of 2026-11-03 (v2.20.x exists
# only as `*-nightly` tags). Re-pin deliberately.
#
# Naming: raw per-platform binaries `topctl-<os>-<arch>` + one checksums.txt
# per release. This is the vocabulary install-top.sh already fetches
# (`topctl-$os-$arch` plus `checksums.txt` for pins — see install-top.sh).
# NOTE: ADR-0002's `TOP_ARCHIVE_SHA256` is the ADAPTER'S synthesized app.json
# archive env key — an unrelated "archive". Release artifacts are not that
# archive; there is no published artifact-name canon in ADR-0002 (it is
# reconciliation canon).
#
# Platforms: Linux arm64+amd64 only — TOP targets Debian 11+ hosts
# (docs/operations/installation.md); macOS is a development-only tier and is
# excluded from releases.
#
# Docker: the CONTROLLER image (the one thing a Dokku host must pull to
# bootstrap itself, ADR-0005) ships from the same release: topctl in a
# minimal runtime image, tagged with the version. Service images remain
# Dokku-routed (git:from-image drives whatever the SPEC names); only TOP's
# own bootstrap artifact needs a registry home — and CI builds it, so the
# hosts never do.
dockers:
  - image_templates:
      - "ghcr.io/toledompm/top/topctl:{{ .Version }}"
      - "ghcr.io/toledompm/top/topctl:bootstrap-pinned"
    dockerfile: cmd/topctl/Dockerfile
    extra_files:
      - cmd/topctl/dokku-shim
    build_flag_templates:
      - "--label=org.opencontainers.image.source=https://github.com/toledompm/top"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    goarch: amd64
  - image_templates:
      - "ghcr.io/toledompm/top/topctl:{{ .Version }}-arm64"
    dockerfile: cmd/topctl/Dockerfile
    extra_files:
      - cmd/topctl/dokku-shim
    build_flag_templates:
      - "--label=org.opencontainers.image.source=https://github.com/toledompm/top"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    goarch: arm64

version: 2

project_name: top

builds:
  - id: topctl
    main: ./cmd/topctl
    binary: topctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      # Injects the build stamp; identical string feeds top_build_info
      # (internal/obs) so `topctl version` and the metric agree.
      - -s -w
      - -X main.version={{ .Version }}

# No plain tar.gz/zip: the `formats: [binary]` archive below ships each build
# RAW as `topctl-<os>-<arch>` — the vocabulary install-top.sh already fetches
# (`topctl-$os-$arch` plus `checksums.txt` for pins).
archives:
  - formats: [binary]
    name_template: topctl-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs[:(]" # commit bodies are curated; CHANGELOG.md is human-owned
      - "^test:"
