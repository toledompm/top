apiVersion: top/v1alpha1
kind: Service
metadata:
  name: grafana
spec:
  source:
    image: docker.io/grafana/grafana
    digest: sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
  ports:
    - { name: http, containerPort: 3000 }
  routing:
    mode: proxy
    domains:
      - metrics.example.com
  dependsOn:
    - db
