# observability/node-exporter.yaml — host metrics (ADR-0010 stack).
# Pinned to the real upstream release (T-605, 2026-11-14): node_exporter
# v1.12.1 (2026-07).
apiVersion: top/v1alpha1
kind: Service
metadata:
  name: node-exporter
  namespace: observability
spec:
  source:
    image: quay.io/prometheus/node-exporter
    tag: v1.12.1
  ports:
    - { name: http, containerPort: 9100 }
  routing:
    mode: internal # scraped by prometheus over the dokku network only
  healthcheck:
    http: { path: /-/healthy, port: http }
    intervalSeconds: 30
  env:
    TZ: UTC
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
  restartPolicy: always
  # NOTE (T-403 status): node_exporter runs with DEFAULT flags and sees
  # its own container's /proc + /sys until the READ-ONLY host mounts land
  # — the v0 spec and Dokku's storage surfaces cannot express them
  # (dokku storage:mount has no read-only flag; docker -v :ro is
  # forbidden to TOP by ADR-0001's docker-CLI boundary). Operator-run
  # interim (outside TOP): dokku docker-options:add
  # observability-node-exporter deploy -v /proc:/host/proc:ro
  # -v /sys:/host/sys:ro — the --path.procfs/--path.sysfs ARGS still
  # need the spec.args contract extension (README "T-403 wiring"
  # items 2+5). Without them the job scrapes but reports container-local
  # numbers, not the host's — treat as provisional.
