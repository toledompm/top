# Grafana dashboard *provider* provisioning: where dashboard JSON files are
# looked up. The dashboards themselves live next to this file
# (…/grafana-provisioning/dashboards/). The provisioning tree is mounted at
# /etc/grafana/provisioning, so the provider scans its own tree: one config
# tree, two Grafana read locations (T-403 wiring — the old separate
# dashboards storage entry is gone).
apiVersion: 1

providers:
  - name: top
    orgId: 1
    folder: TOP
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true # the provider-name yields to local UI edits on a single-operator box
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
