# Grafana datasource provisioning (mounted via the grafana spec's storage
# entry "provisioning" at /etc/grafana/provisioning/datasources/).
# Grafana reads files ending .yaml/.yml/.json here; the .yaml suffix is safe
# in this directory because the ServiceSpec loader only walks repo files at
# depth 1 and 2 (<ns>/<file>.yaml), never deeper (internal/spec/load.go).
#
# The datasource URL is the Dokku network alias of the prometheus app:
# container for app A / proc type P resolves as `A.P` on any dokku-attached
# network (T-403 wiring; deterministic). Grafana dependsOn prometheus so
# the alias exists before grafana's first start over the shared network.
apiVersion: 1 # grafana provisioning API version

datasources:
  - name: Prometheus
    uid: prometheus # referenced by UID from every provisioned dashboard
    type: prometheus
    access: proxy
    url: http://observability-prometheus.web:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s # match the prometheus scrape_interval
