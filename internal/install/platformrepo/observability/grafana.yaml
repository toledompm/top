# observability/grafana.yaml — dashboards (ADR-0010).
# Grafana's admin password is the first real consumer of secretRefs
# (ADR-0008/0010). The T-403 secretRef→env rule is: the secret NAME is the
# dash-kebab form of the env var it feeds — uppercased, dashes as
# underscores — so `gf-security-admin-password` injects as
# GF_SECURITY_ADMIN_PASSWORD (rule spelled out in the platform README and
# enforced by the reconciler's secretEnvKey mapping; ADR-0008's
# lowercase-only name alphabet is what the dashes exist for).
#
# Pinned to the real upstream release (T-605, 2026-11-14): Grafana OSS
# v13.3.1 (the OSS edition's tag on docker.io/grafana/grafana).
apiVersion: top/v1alpha1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  source:
    image: docker.io/grafana/grafana
    tag: 13.3.1
  ports:
    - { name: http, containerPort: 3000 }
  routing:
    mode: proxy
    domains:
      - grafana.example.com # PLACEHOLDER for the operator: your dashboards host
  healthcheck:
    http: { path: /api/health, port: http }
    intervalSeconds: 30
  storage:
    # Container mount points only — the reconciler binds each entry to a
    # TOP-owned host path at <VolumeRoot>/<ns>-<svc>-<entry> (ADR-0009
    # ownership; T-403 wiring) and the controller syncs the repo's
    # grafana-provisioning/ tree into the provisioning entry dir before
    # every apply, so datasources + dashboards are GitOps-managed files.
    # The ONE provisioning tree covers both Grafana read locations:
    # /etc/grafana/provisioning/{datasources,dashboards}/ — the dashboard
    # provider's scan path points at the latter (provider.yaml).
    - { name: data, mountPath: /var/lib/grafana, size: 1Gi }
    - { name: provisioning, mountPath: /etc/grafana/provisioning }
  env:
    TZ: UTC
    GF_SECURITY_ADMIN_USER: admin # the username is not a secret
    GF_SERVER_DOMAIN: grafana.example.com # keep in sync with routing.domains
    GF_USERS_ALLOW_SIGN_UP: "false" # one operator, no self-registration
  secretRefs:
    - gf-security-admin-password # dash-kebab of GF_SECURITY_ADMIN_PASSWORD; resolved at apply (ADR-0008 + T-403 mapping rule)
  dependsOn:
    - prometheus # intra-namespace ordering hint (ADR-0004): datasource target exists first
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
  restartPolicy: always
