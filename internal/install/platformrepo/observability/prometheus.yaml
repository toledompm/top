# observability/prometheus.yaml — the metrics stack (ADR-0010).
# A plain TOP-managed Service like any other: Dokku/Docker keep it up
# whether or not the controller exists; nothing in reconcile reads it
# (observability independence, ADR-0010).
#
# Pinned to the real upstream release (T-605, 2026-11-14): prometheus
# v3.16.0 (latest stable, 2026-11-04; the 3.13.x line is the LTS).
#
# Config delivery (T-403, wired): the scrape config file lives in
# prometheus-config/ and ships to the container through the `config`
# storage entry below — the controller syncs that repo tree into the
# TOP-owned entry dir (<VolumeRoot>/observability-prometheus-config) on
# every reconcile, and the entry mounts in at /etc/prometheus, which is
# the image's DEFAULT --config.file path, so no --config.file arg is
# needed. Retention flags are NOT wired (spec has no args field): see
# README "T-403 wiring" item 2 for the deviation proposal and the
# operator interim.
apiVersion: top/v1alpha1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  source:
    image: docker.io/prom/prometheus
    tag: v3.16.0
  ports:
    - { name: http, containerPort: 9090 }
  routing:
    mode: internal # reachable by grafana over the shared dokku network, not exposed
  healthcheck:
    http: { path: /-/healthy, port: http }
    intervalSeconds: 30
  storage:
    # tsdb data (advisory size ≥ the 1GiB retention cap + headroom).
    - { name: data, mountPath: /prometheus, size: 2Gi }
    # T-403 wiring: the repo's prometheus-config/ tree. The reconciler
    # syncs it into the TOP-owned entry dir <VolumeRoot>/<app>-config
    # before each apply; mounted at /etc/prometheus (the image's default
    # config path — zero container args needed). Files here are live on
    # the bind mount; a config edit still needs a prometheus reload
    # (`top logs`… or dokku ps:restart) to take effect.
    - { name: config, mountPath: /etc/prometheus }
  env:
    TZ: UTC
  resources:
    limits:
      cpu: 500m # small-host default; see README "small-host defaults"
      memory: 512Mi
  restartPolicy: always
