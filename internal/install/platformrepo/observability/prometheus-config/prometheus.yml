# global + rule placeholder config for the Prometheus app
# (spec: observability/prometheus.yaml).
#
# HOW THIS FILE SHIPS: it lives in the platform repo and is mounted into the
# container at /etc/prometheus/prometheus.yml by the reconciler. The mount
# host-path and the config-file flag are the documented T-403 wiring (see
# the platform README's "T-403 handoff" section); this file defines only the
# SHAPE T-403 must fill.
#
# The scrape targets below use the fictional discipline; replace with the
# real network names for your host.

global:
  scrape_interval: 15s # small-host default: 15s, see README
  evaluation_interval: 30s
  external_labels:
    host: example-host # PLACEHOLDER for the operator: your host label

alerting:
  # ADR-0010: NO Alertmanager in v0 — this slot is the documented extension
  # point. Uncovering it later is a normal GitOps change.
  alertmanagers: []

scrape_configs:
  # Prometheus scraping itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # --- T-403 wiring targets (doc placeholders) --------------------------
  # The exact targets depend on how Dokku exposes container-to-container
  # networking for this deployment mode; T-403 fills the mechanics and
  # replaces the TODOs with real hostnames from the running apps.
  #
  # TOP controller (metrics: top_reconcile_total, top_service_drift, ... —
  # internal/obs metric set).
  - job_name: top-controller
    static_configs:
      - targets: ["TODO-T403:8080"] # TODO(T-403): controller container address

  # Host metrics.
  - job_name: node-exporter
    static_configs:
      - targets: ["TODO-T403:9100"] # TODO(T-403): node-exporter container address

  # Per-container metrics (label `name` = Dokku app name, e.g.
  # "core-top-controller" — operator-bounded cardinality).
  - job_name: cadvisor
    static_configs:
      - targets: ["TODO-T403:8080"] # TODO(T-403): cadvisor container address
