# observability/cadvisor.yaml — per-container metrics (ADR-0010: justified
# because Dokku apps are plain Docker containers; without cAdvisor there is
# no per-app resource view).
# The digest below is FICTIONAL; replace with a real pin before deploying.
apiVersion: top/v1alpha1
kind: Service
metadata:
  name: cadvisor
  namespace: observability
spec:
  source:
    image: gcr.io/cadvisor/cadvisor
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333 # fictional — pin a real digest before deploying
  ports:
    - { name: http, containerPort: 8080 }
  routing:
    mode: internal # scraped by prometheus over the dokku network only
  healthcheck:
    http: { path: /healthz, port: http }
    intervalSeconds: 30
  env:
    TZ: UTC
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
  restartPolicy: always
  # NOTE (T-403 status): cAdvisor introspects the host docker daemon and
  # cgroup tree; the v0 spec and Dokku's storage surfaces cannot express
  # the READ-ONLY host mounts it needs (/var/run/docker.sock, /sys,
  # /var/lib/docker — dokku storage:mount has no read-only flag; docker
  # -v :ro is forbidden to TOP by ADR-0001's docker-CLI-boundary). The
  # operator-run interim (outside TOP, mirroring the upstream cAdvisor
  # docker-in-docker rig) is:
  #   dokku docker-options:add observability-cadvisor deploy
  #     -v /var/run/docker.sock:/var/run/docker.sock:ro
  #     -v /sys:/sys:ro -v /var/lib/docker:/var/lib/docker:ro
  # read-only mounts ride the spec.storage[].readOnly proposal below
  # (README "T-403 wiring" item 5). WITHOUT the mounts cadvisor reports
  # only its own container — a lying per-app view — so treat this job as
  # provisional until the mounts land (the dashboard panels just stay
  # empty rather than presenting bad data).
