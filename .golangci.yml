# golangci-lint — deliberately conservative (AGENTS.md rule 5: vet + fmt +
# a static-analysis baseline; no style rabbit-holes). See Makefile `lint`.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused

formatters:
  # `default` is a linters-section key in the v2.1.6 schema (formatters
  # takes gofumpt's own settings via `settings`, and CI's `config verify`
  # rejects the field here) — gofumpt is the only formatter we run.
  enable:
    - gofumpt
